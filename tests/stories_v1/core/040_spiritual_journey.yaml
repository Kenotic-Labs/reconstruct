batches:
- batch: 1
  time: Sunday 10:00 AM
  user_input: 'I went to the Zen Mind Center for the first time today. I''ve been

    wanting to explore meditation and Buddhism for a while. The teacher,

    Sensei Yuki, was incredibly welcoming. He led a guided meditation

    that lasted 30 minutes. I felt calmer than I have in months.

    '
  expected_stores:
  - Zen Mind Center
  - Sensei Yuki
  - meditation
  - Buddhism
  - guided meditation
  - 30 minutes
- batch: 2
  time: Monday 7:00 PM
  user_input: 'The meditation group at the Zen Mind Center meets every Sunday at

    9am. I''m going to make it a regular thing. Sensei Yuki recommended

    I start reading "The Art of Happiness" by the Dalai Lama. I picked

    it up from the bookstore today. Already 20 pages in and it''s

    resonating deeply.

    '
  expected_stores:
  - Sunday
  - 9am
  - The Art of Happiness
  - Dalai Lama
  - reading
- batch: 3
  time: Wednesday 11:00 AM
  user_input: What are the Four Noble Truths in Buddhism?
- batch: 4
  time: Week 2 Sunday 11:00 AM
  user_input: 'Second session at the Zen Mind Center. Sensei Yuki talked about

    mindfulness in daily life. He suggested I try walking meditation

    during my lunch break at work. There were 15 people in the group

    today. I''m starting to feel like part of a community.

    '
  expected_stores:
  - mindfulness
  - walking meditation
  - lunch break
  - 15 people
  - community
- batch: 5
  time: Week 2 Tuesday 3:00 PM
  user_input: What book am I reading and who recommended it?
- batch: 6
  time: Week 3 Monday 8:00 AM
  user_input: 'Sensei Yuki told me about a 10-day silent retreat at Spirit Rock. It

    sounds intense but transformative. No talking, no phones, just

    meditation from 5am to 9pm every day. I signed up for next month.

    I''m nervous but excited.

    '
  expected_stores:
  - 10-day
  - silent retreat
  - Spirit Rock
  - no talking
  - no phones
  - 5am
  - 9pm
- batch: 7
  time: Week 3 Thursday 12:00 PM
  user_input: What is the Eightfold Path in Buddhism?
- batch: 8
  time: Week 5 Monday 9:00 AM
  user_input: 'I just completed the 10-day silent retreat at Spirit Rock. It was the

    hardest and most rewarding thing I''ve ever done. Days 3 and 4 were

    brutal - I wanted to leave. But by day 7 I felt a peace I''ve never

    experienced. Sensei Yuki said I''ve made remarkable progress.

    '
  expected_stores:
  - completed
  - retreat
  - peace
  - remarkable progress
  - hardest
- batch: 9
  time: Week 6 Sunday 10:00 AM
  user_input: Where did I do my silent retreat and how long was it?
