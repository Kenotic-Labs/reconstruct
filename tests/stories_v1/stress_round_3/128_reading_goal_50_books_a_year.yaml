  time: Month 1
  user_input: My New Year goal is 50 books this year. My friend Rashida and I are doing it together —
    we joined a Goodreads challenge and a local book club.
  expected_stores:
  - 50 books
  - Rashida
  - friend
  - Goodreads
  - book club
- batch: 2
  time: Month 2
  user_input: Finished 5 books so far. Best one was 'Piranesi' by Susanna Clarke. Rashida loved 'All the
