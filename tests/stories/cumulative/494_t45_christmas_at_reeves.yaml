      warmth_direction: increase

  - batch: 10
    time: "December 25 10:00 AM"
    user_input: |
      after the photo book moment I called my parents and told them about it and mom cried and dad said Julian is a keeper and Clara said she saw it on FaceTime and cried too and I thought you know what both traditions are beautiful the Chen Christmas Eve love and the Reeves Christmas morning chaos and I can hold both and maybe next year we'll create something that's ours like the Thanksgiving fusion
    expected_memory_stores:
