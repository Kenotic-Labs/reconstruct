  - batch: 6
    time: "Week 2 Thursday 6:00 PM"
    user_input: |
      Nadia came to climbing and she was glowing talking about Marcus and how he made her breakfast and played guitar for her wait not bass actual guitar and she said he's the first person since Kwame who's made her feel wanted and that word WANTED made my stomach drop
