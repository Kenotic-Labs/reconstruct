      - "Marcus made breakfast"
      - "played guitar for her"
      - "first since Kwame"
      - "feel wanted"
      - "Maya's stomach dropped"
    expected_adaptation:
      emotion_detected: "worried"
      warmth_direction: increase

  - batch: 7
    time: "Week 2 Friday 9:00 PM"
    user_input: |
      Julian said I need to let them figure it out and stop hovering and I said I'm not hovering I'm concerned and he said same thing and he said Marcus is a grown man and Nadia is a grown woman and I said yeah but Nadia is fragile right now and he said she might be stronger than you think
    expected_memory_stores:
      - "Julian said stop hovering"
      - "let them figure it out"
      - "Maya hovering/concerned"
      - "Nadia fragile vs strong"
    expected_adaptation:
      emotion_detected: "conflicted"
      warmth_direction: increase

  - batch: 8
    time: "Week 2 Saturday 12:00 PM"
    user_input: |
      how many times has Omar seen Marcus's dating pattern play out
    expected_memory_stores:
