    expected_contains: ["no"]
  - question: "What does Vivian want to see in Portland?"
    expected_contains: ["venue", "Pine Ridge"]
  - question: "Does Vivian want grandchildren?"
    expected_contains: ["yes"]
  - question: "What is Maya's daily monitoring routine?"
    expected_contains: ["7pm call", "Ring camera", "Clara updates"]
  - question: "What did Priya share about her own mother?"
    expected_contains: ["similar", "medication", "fine now"]
  - question: "What event is planned with Blue Fork during the visit?"
    expected_contains: ["second tasting"]
  - question: "How is Vivian's mood now?"
    expected_contains: ["better", "humor", "joking"]
  - question: "Did Vivian win a dance contest?"
    expected_contains: ["cha cha", "1998"]
