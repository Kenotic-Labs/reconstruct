  - batch: 9
    time: "Saturday 10:30 PM"
    user_input: |
      Julian came down and asked how it went and I was like it was okay but not as good as last time and he said that's normal for groups the energy fluctuates and I said yeah but I don't want it to die and he said so don't let it die restructure it and that's exactly what Tessa said too so yeah I'm going to restructure it
