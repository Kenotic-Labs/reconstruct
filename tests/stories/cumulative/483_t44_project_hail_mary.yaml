      - "second meeting"
      - "Project Hail Mary"
      - "Andy Weir"
      - "Maya finished early"
      - "science alien friendship"
      - "group chat quiet"
    expected_adaptation:
      emotion_detected: "excited"
      warmth_direction: increase

  - batch: 2
    time: "Saturday 7:00 PM"
    user_input: |
      so not everyone came tonight like Marcus texted at the last minute saying he can't make it and he didn't really give a reason and Omar came but he only read like the first 100 pages and said he got busy with work and Lily finished and Tessa finished but Nadia said she read most of it and by most she means like 60 percent
    expected_memory_stores:
      - "Marcus no-showed"
      - "no reason given"
      - "Omar read 100 pages"
      - "busy with work"
      - "Lily finished"
      - "Tessa finished"
      - "Nadia 60 percent"
    expected_adaptation:
      emotion_detected: "disappointed"
      warmth_direction: increase

  - batch: 3
    time: "Saturday 7:30 PM"
    user_input: |
      the discussion is still good but it's different because Omar keeps having to say wait what happened and we're like spoiler alert and he's like just tell me and its hard to have a deep conversation when half the people don't know how it ends and I'm trying not to be frustrated but like it's a book club you gotta read the book
    expected_memory_stores:
      - "discussion hampered"
      - "Omar doesn't know ending"
      - "spoiler issues"
      - "Maya frustrated"
      - "need to read the book"
    expected_adaptation:
      emotion_detected: "frustrated"
      warmth_direction: increase

  - batch: 4
    time: "Saturday 8:00 PM"
    user_input: |
      Lily and I had an amazing side conversation about the science in the book and she's an engineer so she appreciated all the physics and she said the relationship between Ryland and Rocky the alien is one of the best friendships in fiction and I completely agree and Tessa said Rocky is basically her spirit animal which is weird because he's an alien spider thing
