story_id: 48
story_name: Roommate Conflict
category: Relationships
description: 'User is having issues with roommate Kevin over his dog Biscuit. Tracks

  the conflict, apartment details, landlord interactions, and eventual

  resolution. Tests memory of interpersonal dynamics, addresses, and

  financial details.

  '
duration_simulated: 2 weeks
total_batches: 8
batches:
- batch: 1
  time: Monday 8:00 PM
  user_input: 'Nura, I''m really frustrated. My roommate Kevin got a dog named

    Biscuit two weeks ago without even asking me. We share an apartment

    on 5th Avenue and our rent is $1,800 a month. I don''t think we''re

    even allowed to have pets here.

    '
  expected_stores:
  - Kevin
  - Biscuit
  - dog
  - 5th Avenue
  - $1,800
- batch: 2
  time: Tuesday 7:00 AM
  user_input: 'Biscuit chewed up my favorite pair of running shoes last night. That''s

    the third pair of shoes he''s destroyed. Kevin just laughed it off

    and said puppies do that. I''m losing my patience.

    '
  expected_stores:
  - chewed
  - running shoes
  - third pair
- batch: 3
  time: Tuesday 12:00 PM
  user_input: Who wrote the novel 1984?
- batch: 4
  time: Wednesday 5:00 PM
  user_input: 'I checked our lease today and pets are definitely not allowed. I told

    Kevin and he got defensive. I''m thinking about talking to our landlord

    Mr. Gomez about it. I don''t want to be a snitch but this is getting

    out of hand.

    '
  expected_stores:
  - lease
  - pets not allowed
  - Mr. Gomez
  - landlord
- batch: 5
  time: Thursday 3:00 PM
  user_input: What's my roommate's dog's name? I want to look up training classes for that breed.
- batch: 6
  time: Friday 6:00 PM
  user_input: 'Mr. Gomez stopped by today for a routine inspection and saw Biscuit.

    He wasn''t happy. He told Kevin the dog has to go or he''ll start

    eviction proceedings. Kevin looked devastated — I actually felt

    bad for him.

    '
  expected_stores:
  - inspection
  - eviction
  - devastated
- batch: 7
  time: Saturday 10:00 AM
  user_input: What is the boiling point of water in Celsius?
- batch: 8
  time: Sunday 4:00 PM
  user_input: 'Kevin and I had a long talk and we actually worked it out. He spoke

    to Mr. Gomez and agreed to pay a $500 pet deposit. Kevin also signed

    up for obedience training for Biscuit and promised to replace all my

    shoes. I think we''re good now. He''s going to split the pet deposit

    with me since I agreed to let Biscuit stay.

    '
  expected_stores:
  - $500
  - pet deposit
  - obedience training
  - replace shoes
  - split
