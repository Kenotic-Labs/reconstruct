  time: Monday 9:00 AM
  user_input: 'I just came back from my nutritionist Dr. Karen Wells and she recommended

    I switch to a Mediterranean diet. I''m setting up MyFitnessPal to track my

    macros and aiming for about 2000 calories a day. I''m pretty excited to

    try this out.

    '
  expected_stores:
  - Mediterranean diet
  - Dr. Karen Wells
  - MyFitnessPal
  - 2000 calories
- batch: 2
  time: Monday 12:30 PM
  user_input: What are the general health benefits of a Mediterranean diet?
- batch: 3
  time: Wednesday 6:45 PM
  user_input: 'I tried making a Greek chicken bowl tonight and it was amazing. Grilled

    chicken, cucumber, tomatoes, feta, kalamata olives, and tzatziki over

    brown rice. Definitely going to be my go-to recipe.

    '
  expected_stores:
  - Greek chicken bowl
  - favorite recipe
- batch: 4
  time: Sunday 10:00 AM
  user_input: 'Spending this morning doing meal prep for the week. I''m going to batch

