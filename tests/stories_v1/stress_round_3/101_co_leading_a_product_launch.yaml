  question: What is the product called?
  expected_contains:
  - Atlas
- question_id: 101_q3
  question: Who is our VP?
  expected_contains:
  - Marco Grasso
- question_id: 101_q4
  question: What area am I handling?
  expected_contains:
  - engineering
- question_id: 101_q5
  question: What area is Isadora handling?
  expected_contains:
  - marketing
- question_id: 101_q6
  question: How many beta testers saw the dry run?
  expected_contains:
  - '200'
- question_id: 101_q7
  question: How many pieces of feedback did we get?
  expected_contains:
  - '18'
- question_id: 101_q8
  question: Why was the launch pushed?
  expected_contains:
