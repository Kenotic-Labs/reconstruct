  - batch: 3
    time: "Friday 7:00 PM"
    user_input: |
      I FaceTime Clara every day and I get to see Sophie and she's already changed like her face is filling out and she's more alert and she made this little sound today that Clara said was almost a coo and I lost my mind even though it was probably just gas but I choose to believe she was saying hi to Auntie Maya
