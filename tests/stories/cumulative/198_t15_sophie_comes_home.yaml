story_id: 198
story_name: "Sophie Settles In"
category: "Life Events"
description: |
  First weeks of Sophie's life at home. Clara and David adjusting to
  parenthood. Remote auntie duties for Maya. Tests tracking baby
  milestones and family adaptation from distance.
duration_simulated: "2 weeks"
