    expected_contains: ["future", "kid", "project", "something alive"]
  - question: "How did Julian react to the daughter discussion?"
    expected_contains: ["excited", "smile", "theoretical"]
  - question: "What did Dr. Tate say about name changes after loss?"
    expected_contains: ["hold onto", "person", "symbolic"]
  - question: "How did Vivian react to Maya's final decision?"
    expected_contains: ["crying", "happy tears", "beautiful"]
