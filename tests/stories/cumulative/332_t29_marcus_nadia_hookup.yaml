    expected_adaptation:
      emotion_detected: "neutral"
      warmth_direction: increase

  - batch: 9
    time: "Week 2 Saturday 4:00 PM"
    user_input: |
      Marcus and Nadia came to the climbing gym together holding hands and it was cute but also super awkward because everyone at the gym now knows they're a thing and Kyle the instructor was like oh you two are together now and Nadia blushed
    expected_memory_stores:
      - "climbing gym together"
      - "holding hands"
      - "publicly a couple"
      - "Kyle noticed"
      - "Nadia blushed"
    expected_adaptation:
      emotion_detected: "uneasy"
      warmth_direction: increase

  - batch: 10
    time: "Week 2 Sunday 8:00 PM"
    user_input: |
      it's been two weeks and they're basically inseparable and I want to be happy for them and I AM happy I just keep hearing Omar's voice saying three weeks and I really hope Marcus proves everyone wrong because if he hurts Nadia after everything she's been through I swear
    expected_memory_stores:
      - "two weeks inseparable"
      - "want to be happy"
      - "three week warning"
      - "hope Marcus proves wrong"
      - "if he hurts Nadia"
    expected_adaptation:
      emotion_detected: "anxious"
      warmth_direction: increase

