story_id: 467
story_name: "Portland Tabletop Meetup"
category: "Gaming"
description: |
  Tests memory of Maya's first Portland Tabletop Meetup experience.
  Establishes IRL gaming social circle, Settlers of Catan introduction.
  Verifies system captures new social connections and venue details.
