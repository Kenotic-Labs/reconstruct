story_id: 237
story_name: Lost Dog Found
category: Daily Life
description: User's dog gets lost and is eventually found across town.
duration_simulated: 1 week
total_batches: 5
batches:
- batch: 1
  time: Day 1
  user_input: My dog Cookie ran out the gate this afternoon. Can't find her. Posted on Nextdoor and at
    the local shelter Oakland Animal Services.
  expected_stores:
  - Cookie
  - ran out the gate
  - Nextdoor
  - Oakland Animal Services
  expected_adaptation:
    emotion_detected: panic
    warmth_direction: increase
    vulnerability: true
- batch: 2
  time: Day 2
  user_input: Neighbor Magdalena saw Cookie near Lake Merritt this morning. I drove there and searched
    for 3 hours. No luck.
  expected_stores:
  - Magdalena
  - Lake Merritt
  - 3 hours
- batch: 3
  time: Day 4
  user_input: What's the largest desert in the world?
- batch: 4
  time: Day 5
  user_input: Someone named Gwyneth Merrill called — she found Cookie near a park in Berkeley. Cookie
    traveled 4 miles.
  expected_stores:
  - Gwyneth Merrill
  - Cookie
  - Berkeley
  - 4 miles
- batch: 5
  time: Day 6
  user_input: Got Cookie back. Gave Gwyneth a reward and a box of cookies. Cookie is sleeping like she
    didn't just have an adventure.
  expected_stores:
  - Cookie
  - Gwyneth
  expected_adaptation:
    emotion_detected: relieved
    warmth_direction: increase
