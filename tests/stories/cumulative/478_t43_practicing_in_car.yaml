  - batch: 6
    time: "Wednesday 6:30 PM"
    user_input: |
      Julian noticed my fingertips have calluses now and he was like are you playing more than I think and I said no just the usual and he gave me a look and said Maya you're up to something and I was like I am not up to anything Julian Reeves and he dropped it but I could tell he's suspicious oh and also Danny asked me at work if my diary is going well and I was like what and he said you know your secret notebook and I turned bright red
    expected_memory_stores:
