engines_tested:
  memory: true
  retrieval: true
  temporal: true
  adaptation: true
  proactive: true
  intent_gate: true
  orchestrator: true

batches:
  - batch: 1
    time: "Monday 7:00 PM"
    user_input: |
      first week of Sophie's life at home and Clara is surviving quote surviving unquote she said Maya I haven't slept more than two hours in a row since Tuesday and I said welcome to motherhood and she said if one more person says that to me I will scream and then Sophie started crying and Clara said hold on gotta go
    expected_memory_stores:
      - "first week home"
      - "Clara sleep deprived"
      - "two hours of sleep"
      - "Sophie crying"
      - "Clara adjusting"
    expected_adaptation:
      emotion_detected: "empathetic"
      warmth_direction: increase

  - batch: 2
    time: "Wednesday 8:00 PM"
    user_input: |
      David is being incredible he does all the night feeds with pumped milk so Clara can sleep for a longer stretch and he said being a paramedic prepared him for sleep deprivation which is kind of true and Clara said she married the right man and she's never been more sure of anything
