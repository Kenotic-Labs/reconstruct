story_id: 458
story_name: "Olympic Peninsula Cross State"
category: "Road Trips"
description: |
  Tests memory of Maya and Julian crossing into Washington for the Olympic Peninsula.
  Establishes first out-of-state trip, rainforest visit, ambitious planning.
  Verifies multi-day temporal tracking and cross-thread references.
