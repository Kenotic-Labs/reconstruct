  - batch: 8
    time: "Saturday 6:00 PM"
    user_input: |
      Mom pulled me aside and said Maya how are YOU doing with everything and I said Mom I'm great and she said no really how are you because there's been a lot this year my health scare Dad's retirement Clara's pregnancy your wedding and she said make sure you're taking care of yourself too and I said I am Mom I promise
    expected_memory_stores:
      - "Vivian checking on Maya"
      - "year has been a lot"
      - "health scare retirement pregnancy wedding"
      - "Maya assuring she's okay"
      - "Vivian maternal concern"
