    user_input: |
      Julian won his FIRST game and he was insufferable about it like he literally stood up and bowed and Omar was like sit down rookie and Nadia threw a game piece at him and I was like this is the best friend group situation and honestly it reminds me of playing Stardew co-op with Julian but better because there's more people and real laughter
    expected_memory_stores:
      - "Julian won first game"
      - "stood up and bowed"
      - "Omar said sit down"
      - "Nadia threw piece"
      - "best friend group"
      - "better than Stardew co-op"
