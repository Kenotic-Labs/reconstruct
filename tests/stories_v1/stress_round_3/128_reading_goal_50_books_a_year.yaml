  expected_stores:
  - 5 books
  - Piranesi
  - Susanna Clarke
  - Rashida
  - All the Light We Cannot See
- batch: 3
  time: Month 4
  user_input: Book club moderator Elena Vidarte recommended 'The Overstory' by Richard Powers. Rashida
    and I both finished it in a week.
  expected_stores:
  - Elena Vidarte
  - moderator
  - The Overstory
  - Richard Powers
  - Rashida
- batch: 4
  time: Month 6
  user_input: How many continents are there?
- batch: 5
  time: Month 6 Week 3
  user_input: At 25 books halfway through the year. Rashida is at 23. On pace for 50 but need to avoid
    the summer slump.
  expected_stores:
  - 25 books
  - Rashida
  - '23'
- batch: 6
  time: Month 9
  user_input: Reading slowed in July but picked up in September. Rashida gave me 'Pachinko' by Min Jin
