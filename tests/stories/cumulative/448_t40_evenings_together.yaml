    expected_contains: ["Thai", "Hawthorne"]
  - question: "How long had it been since Maya made Saturday pancakes?"
    expected_contains: ["11 weeks"]
  - question: "What do they do with phones during dinner?"
    expected_contains: ["put away", "another room"]
  - question: "What did Julian say about why he loves Maya?"
    expected_contains: ["you not job title", "incredible when present"]
  - question: "Where do Maya and Julian hike on Sundays?"
    expected_contains: ["Forest Park"]
  - question: "What did Clara notice about Maya?"
    expected_contains: ["lighter", "less tired", "different"]
  - question: "How long has the 6pm boundary been in effect?"
    expected_contains: ["one month"]
  - question: "How is Maya and Julian's relationship now?"
    expected_contains: ["stronger", "protect time"]
  - question: "What lesson did the overwork period teach them?"
    expected_contains: ["not take for granted", "protect time"]
