      - "GK trap"
    expected_adaptation:
      emotion_detected: "neutral"
      warmth_direction: increase

  - batch: 9
    time: "Friday 6:00 PM"
    user_input: |
      I told Lily Tran about the tabletop meetup and she was like ooh can I come and I said of course and then Marcus heard and he was like I used to play Catan in college and I was like Marcus you should totally come this is becoming a whole thing and Danny Ruiz was like I'll stick to my PlayStation and I was like your loss Danny
    expected_memory_stores:
      - "Lily wants to come"
      - "Marcus Catan in college"
      - "Marcus might come"
      - "Danny prefers PlayStation"
    expected_adaptation:
      emotion_detected: "enthusiastic"
      warmth_direction: increase

  - batch: 10
    time: "Friday 8:00 PM"
    user_input: |
      you know what's funny is this whole thing started with Stardew Valley which started with Lily's recommendation which led to Discord which led to the PixelDruid thing which led to Julian saying go do IRL gaming which led to the tabletop meetup and now I have this amazing group of friends and a Thursday night tradition and I still play Stardew sometimes solo for the calm but the real community is here in person
    expected_memory_stores:
      - "full arc reflection"
      - "Stardew to Discord to tabletop"
      - "Lily started it"
      - "PixelDruid catalyst"
      - "Julian suggestion"
      - "Thursday tradition"
      - "solo Stardew for calm"
      - "real community IRL"
    expected_adaptation:
      emotion_detected: "grateful"
      warmth_direction: increase

