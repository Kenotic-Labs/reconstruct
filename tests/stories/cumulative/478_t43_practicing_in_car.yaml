batches:
  - batch: 1
    time: "Monday 12:15 PM"
    user_input: |
      okay so the car practice thing is now a daily routine like every lunch break I go to the parking garage at Conduit sit in the Subaru and play the wedding song for 30 minutes and Lily asked me today why I always disappear at lunch and I said I'm doing a personal project and she was like is it code related and I said no it's more of a creative thing
    expected_memory_stores:
      - "daily car practice"
      - "parking garage Conduit"
      - "30 minutes lunch"
      - "Lily asked"
      - "creative project"
    expected_adaptation:
      emotion_detected: "dedicated"
      warmth_direction: increase

  - batch: 2
    time: "Wednesday 12:30 PM"
    user_input: |
      the song is getting better like the chord transitions are smoother and I added a little fingerpicking intro which is way beyond my skill level but I watched a Justin Guitar fingerpicking tutorial and it's just thumb and index finger alternating on the bass strings and it sounds so pretty I can't believe I'm doing this
    expected_memory_stores:
      - "song improving"
      - "smoother transitions"
      - "fingerpicking intro"
      - "Justin Guitar tutorial"
      - "thumb and index finger"
      - "bass strings"
    expected_adaptation:
      emotion_detected: "proud"
      warmth_direction: increase

  - batch: 3
    time: "Friday 12:00 PM"
    user_input: |
      so a security guard knocked on my car window today while I was playing and scared the absolute daylights out of me and he was like ma'am are you okay and I was like yes sir I'm practicing guitar and he looked at me like I was insane and walked away and now I'm paranoid everyone in the parking garage can hear me
    expected_memory_stores:
      - "security guard knocked"
      - "scared Maya"
      - "security confused"
      - "paranoid about noise"
      - "parking garage acoustics"
    expected_adaptation:
      emotion_detected: "embarrassed"
      warmth_direction: increase

  - batch: 4
    time: "Monday 12:15 PM"
    user_input: |
      second week of car practice and I've memorized the whole song now like I don't need the notebook and I can sing and play at the same time which was the hardest part because your brain has to do two different things at once and Justin Guitar has a whole module on singing while playing and it's basically about making the guitar automatic so your brain can focus on singing
    expected_memory_stores:
      - "second week practice"
      - "memorized whole song"
      - "sing and play simultaneously"
      - "brain coordination"
      - "Justin Guitar singing module"
      - "guitar automatic"
