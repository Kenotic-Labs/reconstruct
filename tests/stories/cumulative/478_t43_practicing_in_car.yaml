story_id: 478
story_name: "Practicing in Car at Lunch"
category: "Music and Guitar"
description: |
  Tests memory of Maya's dedicated car practice routine for the wedding song.
  Establishes commitment to secrecy, physical improvement, coworker suspicions.
  Verifies temporal tracking of practice routine.
