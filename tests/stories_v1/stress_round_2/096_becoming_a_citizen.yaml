  - next month
  - 100 questions
  expected_adaptation:
    emotion_detected: anxious
    warmth_direction: increase
- batch: 6
  time: Month 12
  user_input: Passed the interview and civics test. Got 6 out of 6 on the civics. The interviewing officer
