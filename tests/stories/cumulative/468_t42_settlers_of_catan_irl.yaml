      - "third meetup Catan"
      - "homemade brownies"
      - "Tessa brought cookies last time"
      - "snack tradition"
      - "Dave compliment"
      - "Kyle from Nike"
    expected_adaptation:
      emotion_detected: "belonging"
      warmth_direction: increase

  - batch: 4
    time: "Thursday 8:30 PM"
    user_input: |
      so Omar is actually a really aggressive Catan player like he builds roads everywhere and blocks everyone and Nadia was FURIOUS and she goes Omar I thought we were friends and he goes in Catan there are no friends and Julian would love this energy honestly I should bring him sometime
