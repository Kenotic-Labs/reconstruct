    expected_contains: ["foundation", "can't be on resume"]
  - question: "What accomplishments did Maya list?"
    expected_contains: ["job", "house", "climbing", "cooking", "hosting", "mental health"]
  - question: "What did Dr. Tate say about LinkedIn's definition of success?"
    expected_contains: ["only things LinkedIn celebrates"]
  - question: "What was Maya's first pride homework entry?"
    expected_contains: ["Julian laugh", "Kobe trusts", "called mom"]
  - question: "What realization did Maya have about grandpa?"
    expected_contains: ["accomplishments inside family"]
  - question: "Why did Maya spiral on her birthday?"
    expected_contains: ["compared", "nonspecific everyone"]
  - question: "What did Julian say about therapy validation?"
    expected_contains: ["copay", "only believe", "compliments"]
  - question: "How did Dr. Tate respond to Maya's two biggest accomplishments?"
    expected_contains: ["massive", "same year"]
  - question: "What does Dr. Tate say the real accomplishments are?"
    expected_contains: ["home", "relationship", "friendship", "mental health"]
