  time: Monday afternoon
  user_input: Got three quotes. Best one is from a plumber named Ed Fawcett at 1850 dollars installed
    for a 50 gallon Rheem. He can come Wednesday.
  expected_stores:
  - three quotes
  - Ed Fawcett
  - plumber
  - 1850 dollars
  - 50 gallon Rheem
  - Wednesday
- batch: 3
  time: Tuesday
  user_input: Taking cold showers and boiling water on the stove for dishes. My wife Pilar is being a
