    time: "Saturday 6:00 PM"
    user_input: |
      okay so it's book club meeting number two and we're doing Project Hail Mary by Andy Weir and I finished it like two weeks ago and it was INCREDIBLE like the science and the alien friendship and the ending made me cry and honestly it might be my favorite book ever but the group chat has been quiet which is not a great sign
