    user_input: |
      third meetup and it's Catan night again and I brought homemade brownies because Tessa brought cookies last time and now we have a thing going where everyone brings snacks and Dave said we're the best group the meetup has ever had and Jim and Robin brought their friend Kyle who works at Nike and he's really fun
