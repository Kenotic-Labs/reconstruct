  - boiling water
  - Pilar
  - wife
- batch: 4
  time: Wednesday 10 AM
  user_input: Ed arrived on time. Installation took about three hours. He also replaced the shutoff valve
    because the old one was seized.
  expected_stores:
  - Ed
  - three hours
  - shutoff valve
- batch: 5
  time: Wednesday 3 PM
