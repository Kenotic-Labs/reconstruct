  - batch: 5
    time: "Tuesday 7:00 PM"
    user_input: |
      Jenny called and asked for an update and I played the song for her over the phone and she said Maya it's night and day from the first version and the fingerpicking intro is gorgeous and the lyrics about the maps we've made literally made her cry again and she said Julian is going to propose at his own wedding because he'll want to marry me twice
    expected_memory_stores:
      - "Jenny update call"
      - "night and day improvement"
      - "fingerpicking praised"
      - "maps lyrics"
      - "Jenny cried again"
      - "marry twice joke"
