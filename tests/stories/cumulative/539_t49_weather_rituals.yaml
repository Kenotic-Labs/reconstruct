    expected_contains: ["walk Kobe", "make soup"]
  - question: "What are Maya's sun day rituals?"
    expected_contains: ["hike", "climb"]
  - question: "What indoor plants did Maya buy for winter?"
    expected_contains: ["pothos", "succulent"]
  - question: "What is Maya's winter evening ritual?"
    expected_contains: ["lamp", "walk", "soup", "candles", "read"]
  - question: "What happened during the first frost?"
    expected_contains: ["Kobe", "ice", "water bowl"]
  - question: "What does Maya say about rituals and home?"
    expected_contains: ["turn a place into home"]
  - question: "Would Maya trade Portland weather for California?"
    expected_contains: ["no", "wouldn't trade"]
  - question: "What kind of soup did Maya make on Wednesday?"
    expected_contains: ["minestrone"]
  - question: "What does Maya say boring is?"
    expected_contains: ["underrated"]
  - question: "How does Maya describe the cherry tree without leaves?"
    expected_contains: ["bare", "branches", "spreading"]
