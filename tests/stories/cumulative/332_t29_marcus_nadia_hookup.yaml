story_id: 332
story_name: "Marcus and Nadia Hook Up"
category: "Friendships"
description: |
  Tests memory of the Marcus-Nadia relationship developing. Wine-fueled
  hookup turns into a brief fling. Maya watches nervously from the sidelines.
  Verifies system tracks inter-character romantic dynamics.
duration_simulated: "2 weeks"
total_batches: 10

engines_tested:
  memory: true
  retrieval: true
  temporal: true
  adaptation: true
  proactive: true
  intent_gate: true
  orchestrator: true

batches:
  - batch: 1
    time: "Monday 8:00 PM"
    user_input: |
      Nadia and Marcus have been texting constantly since Saturday night and she keeps showing me their texts and he's being really cute sending her memes and asking about her day and I'm like ok this is adorable but also dangerous
    expected_memory_stores:
      - "constant texting"
      - "Marcus sending memes"
      - "adorable but dangerous"
    expected_adaptation:
      emotion_detected: "cautious"
      warmth_direction: increase

  - batch: 2
    time: "Wednesday 7:30 PM"
    user_input: |
      Marcus took Nadia to dinner at Canard which is like a nice restaurant choice for Marcus who usually suggests pizza and she said he opened the car door for her and everything and I was like wow ok Marcus is trying
    expected_memory_stores:
      - "dinner at Canard"
      - "nice for Marcus"
      - "opened car door"
      - "Marcus trying"
    expected_adaptation:
      emotion_detected: "surprised"
      warmth_direction: increase

  - batch: 3
    time: "Friday 9:00 PM"
    user_input: |
      they went out again tonight and Nadia said they ended up back at his place and she stayed over and she was being coy about the details and I was like ok I don't need to know everything but she looked happy and that matters
    expected_memory_stores:
