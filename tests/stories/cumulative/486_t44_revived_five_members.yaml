    user_input: |
      Tessa connected the book to her nonprofit work and how the people she serves are anxious about basic survival and sometimes we forget that anxiety isn't just a middle class thing and everyone got really quiet and Nadia said Tessa always has the best takes and Marcus was like okay I formally apologize for missing the last two meetings this is incredible
    expected_memory_stores:
      - "Tessa nonprofit connection"
      - "anxiety and survival"
      - "not just middle class"
      - "everyone quiet"
      - "Nadia Tessa best takes"
      - "Marcus apologized for missing"
    expected_adaptation:
      emotion_detected: "moved"
      warmth_direction: increase

  - batch: 6
    time: "Saturday 9:00 PM"
    user_input: |
      the Swedish meatballs were demolished like there's not a single one left and Omar had four servings and Tessa's apple cake is the best thing I've ever tasted and she won't give me the recipe because she says a girl needs secrets and I was like Tessa I have a secret guitar song and she doesn't know about the wedding song so she just looked confused
