    expected_contains: ["found my way home", "road led to you"]
  - question: "Who knows about the wedding song?"
    expected_contains: ["Jenny"]
  - question: "When will Maya play the song at the wedding?"
    expected_contains: ["reception", "before first dance"]
  - question: "What road trip reference is in the song?"
    expected_contains: ["miles", "maps", "Google Map"]
  - question: "How long is the song?"
    expected_contains: ["two and a half minutes"]
  - question: "What did Maya tell Julian about her car time?"
    expected_contains: ["meditation"]
  - question: "What chords does the song use?"
    expected_contains: ["G", "D", "C"]
  - question: "Where does Maya hide the lyric notebook?"
    expected_contains: ["car"]
