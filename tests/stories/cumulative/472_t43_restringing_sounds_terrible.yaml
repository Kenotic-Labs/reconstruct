  - question: "How do Maya's fingers feel?"
    expected_contains: ["sore", "hurt", "cramping"]
  - question: "How did Kobe react to Maya's playing?"
    expected_contains: ["left the room"]
  - question: "What did Vivian say when Maya played for her?"
    expected_contains: ["Grandpa Wei", "proud"]
