story_id: 190
story_name: Lost Wallet
category: Daily Life
description: User loses her wallet and navigates replacing everything.
duration_simulated: 1 week
total_batches: 4
batches:
- batch: 1
  time: Monday
  user_input: I lost my wallet at Whole Foods in Berkeley. Called them — nobody turned it in. Cancelled
    all my cards.
  expected_stores:
  - Whole Foods
  - Berkeley
  expected_adaptation:
    emotion_detected: frustrated
    warmth_direction: neutral
- batch: 2
  time: Tuesday
  user_input: Went to the DMV in Oakland to replace my license. 38 dollars. Took 2 hours. The clerk Eulalia
    was nice.
  expected_stores:
  - DMV
  - Oakland
  - 38 dollars
  - Eulalia
- batch: 3
  time: Wednesday
  user_input: What's the tallest tree?
- batch: 4
  time: Friday
  user_input: Got a call from Whole Foods — someone turned my wallet in. All the cards were in it. Cash
    was gone but I didn't care.
  expected_stores:
  - Whole Foods
  expected_adaptation:
    emotion_detected: relieved
    warmth_direction: increase
