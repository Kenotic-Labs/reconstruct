    expected_contains: ["ginger"]
  - question: "What did Maya forget in the first batch?"
    expected_contains: ["sesame oil"]
  - question: "Who helped Maya fold dumplings?"
    expected_contains: ["Julian"]
  - question: "How are Maya and Vivian cooking together?"
    expected_contains: ["FaceTime"]
  - question: "What did Vivian mean by 'you have his hands'?"
    expected_contains: ["handle things", "not folding"]
  - question: "Where did Maya store the recipe?"
    expected_contains: ["Wei folder", "handwritten card"]
  - question: "What event is planned around the dumpling recipe?"
    expected_contains: ["dumpling night", "hosting", "Clara"]
  - question: "What did Julian say about the dumplings?"
    expected_contains: ["both", "grandpa's", "yours"]
  - question: "How does the dumpling smell connect to Fresno?"
    expected_contains: ["grandpa's apartment"]
  - question: "Who was better at folding dumplings?"
    expected_contains: ["Julian"]
