      Tessa stayed late and we talked about it and she said book clubs die when the book is too long or too hard and Project Hail Mary is like 500 pages which is a lot and she suggested shorter books next time and maybe sending discussion questions ahead of time so people feel prepared and I was like those are really good ideas Tessa
    expected_memory_stores:
