  user_input: Hit two weeks. Cravings are starting to fade. Noelani and I are using a quit-smoking app
    called Quit Genius to track progress. We've saved 140 dollars so far.
  expected_stores:
  - Noelani
  - Quit Genius
  - 140 dollars
- batch: 5
  time: Month 2
  user_input: Had a setback — Noelani smoked one cigarette at a wedding this weekend. She was honest about
    it. Pablo said one slip is okay if she gets back on the wagon.
  expected_stores:
  - Noelani
  - wedding
  - Pablo
- batch: 6
  time: Month 3
  user_input: Three months clean for me, 10 weeks for Noelani. Pablo said our lung function numbers are
