    expected_adaptation:
      emotion_detected: "neutral"
      warmth_direction: increase

  - batch: 9
    time: "Last Sunday 4:00 PM"
    user_input: |
      Nadia and I walked around the neighborhood after and she said she's really glad we're doing this because books saved her during the divorce and having people to talk about them with makes it even better and she wants to eventually expand the club
    expected_memory_stores:
      - "walk after meeting"
      - "books saved during divorce"
      - "shared reading better"
      - "expand club eventually"
    expected_adaptation:
      emotion_detected: "warm"
      warmth_direction: increase

  - batch: 10
    time: "Last Sunday 7:00 PM"
    user_input: |
      started Parable of the Sower tonight and it's already incredible like the first chapter grabbed me and I sent Nadia a message saying buckle up this one's gonna be intense and she said she's starting tomorrow after work and I love that we're on this journey together
    expected_memory_stores:
      - "started Parable of Sower"
      - "incredible first chapter"
      - "Nadia starting tomorrow"
      - "journey together"
    expected_adaptation:
      emotion_detected: "eager"
      warmth_direction: increase

