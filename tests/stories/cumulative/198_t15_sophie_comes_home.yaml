      emotion_detected: "delighted"
      warmth_direction: increase

  - batch: 4
    time: "Week 2 Monday 7:00 PM"
    user_input: |
      Sophie had her first pediatrician visit and she's gained weight she's 5 pounds 12 ounces now up from 5 eight at birth and the doctor said she's doing great for a 36 weeker and her jaundice cleared up and all her reflexes are normal and Clara was beaming she said my baby is thriving
