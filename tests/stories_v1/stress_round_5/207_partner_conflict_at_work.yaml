- batch: 1
  time: Week 1 Monday
  user_input: My work partner Oswaldo and I contradicted each other in front of our client CEO named Tallulah
    Dane. Embarrassing for both of us.
  expected_stores:
  - Oswaldo
  - Tallulah Dane
  - client CEO
- batch: 2
  time: Week 1 Wednesday
  user_input: Oswaldo and I debriefed. He said I blindsided him by changing our position mid meeting.
    I said he should have caught up faster.
  expected_stores:
  - Oswaldo
- batch: 3
  time: Week 1 Friday
  user_input: What's the smallest bone in the body?
- batch: 4
  time: Week 2 Tuesday
  user_input: Tallulah emailed both of us saying she respected the debate and wanted us to continue the
    contract. Neither Oswaldo nor I expected that.
  expected_stores:
  - Tallulah
  - Oswaldo
- batch: 5
  time: Week 2 Friday
  user_input: Oswaldo and I rebuilt trust over drinks. He apologized for defaulting to defensive. I apologized
    for not pre-syncing. Our next client meeting is in two weeks.
  expected_stores:
  - Oswaldo
  - two weeks
  expected_adaptation:
    emotion_detected: repaired
    warmth_direction: increase
