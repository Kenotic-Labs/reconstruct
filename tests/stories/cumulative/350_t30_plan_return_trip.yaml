  - question: "What places are on the Japan return trip list?"
    expected_contains: ["Hiroshima", "Nara", "Nagano", "Hakone", "Okinawa"]
  - question: "When do they plan to return to Japan?"
    expected_contains: ["two to three years", "after wedding"]
  - question: "What book did the Angry Planet Club pick by a Japanese author?"
    expected_contains: ["Memory Police", "Yoko Ogawa"]
  - question: "How much did the Japan trip end up costing?"
    expected_contains: ["$8200"]
