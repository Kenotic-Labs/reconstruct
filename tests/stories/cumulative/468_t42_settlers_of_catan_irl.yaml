      fourth meetup and Julian actually came tonight and he was SO into it and he and Dave were geeking out about game design because Julian has a designer's eye for the board layout and also Julian and Omar were immediately competitive and trash talking and I was like great I created a monster by bringing my fiance to game night
    expected_memory_stores:
      - "fourth meetup"
      - "Julian came"
      - "Julian and Dave game design"
      - "Julian and Omar competitive"
      - "trash talking"
      - "Maya brought fiance"
