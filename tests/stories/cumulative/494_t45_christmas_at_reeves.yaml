    expected_adaptation:
      emotion_detected: "neutral"
      warmth_direction: increase

  - batch: 9
    time: "December 25 8:00 AM"
    user_input: |
      Christmas morning and Diane had us all up at 7 AM sharp and we did stockings first and Julian got candy and a new lens cap for his camera and I got a really nice scarf and earrings and then we did the tree presents and that's when Julian gave me the photo book the road trip photo book called Our Oregon and Beyond and I completely fell apart
    expected_memory_stores:
