  - batch: 5
    time: "Saturday 8:30 PM"
    user_input: |
      Omar left early because he and Nadia have a climbing thing tomorrow morning and Nadia said sorry and I was like it's fine but honestly the vibe tonight is not as good as the first one and there's only four of us now and I'm worried the book club is already falling apart which happens to like every book club according to the internet
