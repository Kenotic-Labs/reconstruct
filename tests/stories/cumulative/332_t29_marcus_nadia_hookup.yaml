      - "always complicated"
    expected_adaptation:
      emotion_detected: "validated"
      warmth_direction: increase

  - batch: 5
    time: "Week 2 Wednesday 8:00 PM"
    user_input: |
      Omar pulled me aside at work well not work but we met for coffee and he said he's worried about the Marcus Nadia thing because Marcus has a pattern of being super into someone for like three weeks and then ghosting and Omar said he's seen it four times
    expected_memory_stores:
