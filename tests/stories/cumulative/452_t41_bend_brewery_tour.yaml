    time: "Saturday 11:30 PM"
    user_input: |
      home safe and picked up Kobe from Nadia's and she was like how was it and I told her about Bend and she said she and Omar want to come next time and do a group trip and I'm like yes absolutely oh and Julian is already asleep on the couch with Kobe he didn't even make it to bed this man
    expected_memory_stores:
