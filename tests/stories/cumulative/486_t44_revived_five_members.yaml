      - "Marcus thanked Maya"
      - "Omar favorite social thing"
      - "Lily ordered next book"
      - "Tessa said it worked"
      - "Nadia project manager comment"
      - "engineer not PM"
    expected_adaptation:
      emotion_detected: "triumphant"
      warmth_direction: increase

  - batch: 10
    time: "Saturday 10:45 PM"
    user_input: |
      Julian is eating leftover meatballs and he asked how it went and I said five people came everyone finished the book the discussion was incredible and the themed snacks were a hit and he said well look at that you fixed it and I said yeah I did and honestly this book club is becoming one of the best things in my life alongside road trips and guitar and climbing and tabletop and I feel SO rich in community right now
    expected_memory_stores:
      - "Julian leftover meatballs"
      - "five people"
      - "everyone finished"
      - "incredible discussion"
