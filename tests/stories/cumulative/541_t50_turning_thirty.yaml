    expected_contains: ["done more than she knows"]
  - question: "Where was the birthday dinner?"
    expected_contains: ["Thai", "Alberta"]
  - question: "What climbing progress did Omar point out?"
    expected_contains: ["V1 to V5"]
  - question: "What did Jenny say about Maya's journey?"
    expected_contains: ["PIP", "dinner parties", "house", "promoted"]
  - question: "What did Vivian's birthday text say?"
    expected_contains: ["greatest accomplishment"]
  - question: "Who was at the birthday dinner?"
    expected_contains: ["Clara", "Ben", "Omar", "Leila", "Raj", "Meera"]
  - question: "What comparison trap did Maya fall into on Instagram?"
    expected_contains: ["college", "married", "babies", "companies"]
