    expected_contains: ["coordinates", "Burnside Bridge", "first kiss"]
  - question: "What is Maya's ring engraving?"
    expected_contains: ["date", "music note"]
  - question: "How much did both rings cost?"
    expected_contains: ["1800"]
  - question: "Who helped them at the jewelry store?"
    expected_contains: ["Rosa"]
  - question: "What did Julian buy at the record store?"
    expected_contains: ["Goonies soundtrack"]
  - question: "What did Julian say about rings versus engagement?"
    expected_contains: ["question", "answer"]
  - question: "When will Maya's ring be ready?"
