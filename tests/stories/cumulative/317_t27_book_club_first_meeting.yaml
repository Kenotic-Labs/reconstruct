      - "Portland food better"
      - "two worlds merging"
    expected_adaptation:
      emotion_detected: "fulfilled"
      warmth_direction: increase

  - batch: 7
    time: "Last Sunday 1:00 PM"
    user_input: |
      Jenny had to go but she said Nadia is awesome and she totally gets why I'm friends with her and Nadia said the same thing about Jenny and I felt like a proud mom introducing her kids which sounds weird but that's what it felt like
    expected_memory_stores:
      - "Jenny approves of Nadia"
      - "Nadia approves of Jenny"
      - "Maya proud"
    expected_adaptation:
      emotion_detected: "proud"
      warmth_direction: increase

  - batch: 8
    time: "Last Sunday 2:00 PM"
    user_input: |
      what book did they pick for next month's Angry Planet Club
    expected_memory_stores:
