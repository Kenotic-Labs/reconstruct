  Establishes deepening friendships, competitive streak, social integration.
  Verifies system tracks evolving social patterns and cross-thread references.
duration_simulated: "2 weeks"
total_batches: 10

engines_tested:
  memory: true
  retrieval: true
  temporal: true
  adaptation: true
  proactive: true
  intent_gate: true
  orchestrator: true

batches:
  - batch: 1
    time: "Thursday 6:00 PM"
    user_input: |
      second tabletop meetup tonight and Omar actually came this time and he walked in and was like whoa this is way more people than I expected and Dave was like welcome my dude and gave him a beer and Omar fit right in immediately because he's just like that you know he's so social and we played Ticket to Ride which is about building train routes
    expected_memory_stores:
      - "second meetup"
      - "Omar came"
      - "Dave welcomed Omar"
      - "Ticket to Ride"
      - "train routes game"
    expected_adaptation:
      emotion_detected: "happy"
      warmth_direction: increase

  - batch: 2
    time: "Thursday 8:00 PM"
    user_input: |
      okay so Ticket to Ride is fun but I like Catan better because there's more strategy and trading and Nadia is already obsessed with Ticket to Ride though because she won and she was like THIS is my game and Tessa and I just looked at each other like here we go competitive Nadia is activated
    expected_memory_stores:
      - "Maya prefers Catan"
      - "Nadia won Ticket to Ride"
      - "Nadia competitive"
      - "Tessa and Maya bonding"
    expected_adaptation:
      emotion_detected: "amused"
      warmth_direction: increase

