  - batch: 8
    time: "Saturday 10:00 PM"
    user_input: |
      what book did the group choose for next meeting
    expected_memory_stores:
      - "GK trap"
    expected_adaptation:
      emotion_detected: "neutral"
      warmth_direction: increase

  - batch: 9
    time: "Saturday 10:15 PM"
    user_input: |
      everyone's leaving and Marcus gave me a bro hug and said thanks for not giving up on the club and Omar said this is his favorite social thing after climbing and Lily said she's already ordered Klara and the Sun and Tessa said see I told you it would work if you restructured and Nadia said you're such a project manager Maya and I said I'm an engineer not a PM and she said same energy
