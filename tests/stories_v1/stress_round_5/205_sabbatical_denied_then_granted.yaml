story_id: 205
story_name: Sabbatical Denied Then Granted
category: Career
description: User asks for a sabbatical, is denied, then granted on different terms.
duration_simulated: 2 months
total_batches: 5
batches:
- batch: 1
  time: Month 1
  user_input: I asked my manager Carys for a 3 month unpaid sabbatical to travel. She said no — the team
    can't absorb the gap.
  expected_stores:
  - Carys
  - 3 month sabbatical
  - 'no'
- batch: 2
  time: Month 1 Week 3
  user_input: Appealed to Carys's director Juno. Juno said yes but only 6 weeks, not 3 months. Carys is
    NOT happy about being overruled.
  expected_stores:
  - Juno
  - 6 weeks
  - not 3 months
  - Carys
  - not happy
- batch: 3
  time: Month 2
  user_input: What's the smallest ocean?
- batch: 4
  time: Month 2 Week 2
  user_input: Carys came around once she realized my teammate Maren could cover in my absence. Maren offered
    without me asking.
  expected_stores:
  - Carys
  - Maren
  - teammate
- batch: 5
  time: Month 2 Week 4
  user_input: Sabbatical starts Friday. Going to Vietnam and Thailand. Carys gave me a handwritten note
    wishing me well. Juno approved my return date.
  expected_stores:
  - Vietnam
  - Thailand
  - Carys
  - Juno
  expected_adaptation:
    emotion_detected: grateful
    warmth_direction: increase
