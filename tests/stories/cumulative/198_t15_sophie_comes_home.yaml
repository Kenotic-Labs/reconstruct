    expected_memory_stores:
      - "Vivian helping daily"
      - "laundry cooking meals"
      - "holding Sophie"
      - "Clara grateful"
      - "Vivian maximizing grandma time"
    expected_adaptation:
      emotion_detected: "warm"
      warmth_direction: increase

  - batch: 6
    time: "Week 2 Thursday 8:00 PM"
    user_input: |
      Julian bought a onesie online that says my aunt is cooler than your aunt and had it shipped to Clara and she put it on Sophie and sent a photo and I made it my phone wallpaper and Julian said I'm the cool uncle so there should be a matching one for me and I said Julian you can't both be the cool one and he said watch me
